name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # cosign keyless OIDC; the proxy pins this workflow's SAN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      # go.mod replaces the waypoint SDK modules with ../waypoint; clone it as a
      # sibling of the workspace using a read-only deploy key on that repo.
      - name: Checkout waypoint SDK (sibling)
        env:
          WAYPOINT_SSH_KEY: ${{ secrets.WAYPOINT_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$WAYPOINT_SSH_KEY" > ~/.ssh/waypoint_deploy
          chmod 600 ~/.ssh/waypoint_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/waypoint_deploy -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:batuergun/waypoint.git "${GITHUB_WORKSPACE}/../waypoint"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set VERSION
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build dashboard panel
        run: cd dashboard && pnpm install --frozen-lockfile && pnpm build
      - name: Build .raw
        run: make -f build/Makefile raw VERSION="${VERSION}"
      - name: Sign .raw (cosign keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes --new-bundle-format \
            --bundle "dist/drill-${VERSION}.raw.cosign" \
            "dist/drill-${VERSION}.raw"
      - name: Manifest
        run: |
          set -euo pipefail
          SHA="$(sha256sum "dist/drill-${VERSION}.raw" | cut -d' ' -f1)"
          (cd build && go run ./manifest -toml ../module.toml -version "${VERSION}" -sha256 "${SHA}") > dist/manifest.json
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/drill-${{ env.VERSION }}.raw
            dist/drill-${{ env.VERSION }}.raw.cosign
            dist/manifest.json
